name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check shell syntax
        run: |
          sh -n bin/sprout install.sh scripts/*.sh
          ruby -c scripts/test-bsp.rb

      - name: Test and assemble release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: sbt "set ThisBuild / version := \"$VERSION\"" check cli/assembly

      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          scripts/package-release.sh "$VERSION"
          sha=$(awk -v archive="sprout-$VERSION.tar.gz" '$2 == archive { print $1 }' "target/release/sprout-$VERSION-checksums.txt")
          scripts/render-homebrew-formula.sh "$VERSION" "$sha" target/release/sprout.rb
          ruby -c target/release/sprout.rb
          grep -F -- '-Dsprout.launcher=#{bin}/sprout' target/release/sprout.rb
          grep -F -- 'system bin/"sprout", "setup-ide"' target/release/sprout.rb

      - name: Test packaged installation
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: scripts/test-distribution.sh "$VERSION" target/release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          assets=(
            "target/release/sprout-$VERSION.tar.gz"
            "target/release/sprout-$VERSION.zip"
            "target/release/sprout-$VERSION-checksums.txt"
            "target/release/sprout.rb"
            "install.sh"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Sprout $VERSION"
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: mywyau/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p homebrew-tap/Formula
          cp target/release/sprout.rb homebrew-tap/Formula/sprout.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sprout.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already points to Sprout $VERSION"
          else
            git commit -m "Update Sprout to $VERSION"
            git push origin HEAD:main
          fi
